name: Update contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-graph.yml"

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate contribution SVG cards
        uses: tiennm99/ghstats@v1
        with:
          user: ${{ github.repository_owner }}
          themes: github_dark,github
          include_private: "false"
          start_of_week: monday
          commit_changes: "false"

      - name: Commit daily contribution heatmaps
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the calendar-style daily heatmaps from ghstats.
          git add -f \
            output/github_dark/contributions-heatmap.svg \
            output/github/contributions-heatmap.svg

          if git diff --cached --quiet; then
            echo "Contribution heatmaps are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh contribution heatmaps"

          # ghstats also rewrites tracked generated cards. Reset those working-tree
          # changes before rebasing; untracked generated cards do not block rebase.
          git reset --hard HEAD

          git pull --rebase origin main
          git push origin HEAD:main
